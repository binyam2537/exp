<title>The Painted Jar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
/* Layout: one big play-table for the jar, a mission strip under it, chunky buttons, a quiet "about this object" note. Deliberately one warm daylight look, like a children's gallery. */
:root {
  --sand: #f7ecdc;       /* gallery wall */
  --sand-2: #efdcc3;     /* table and panels */
  --clay: #d9a98a;       /* hairlines, from the jar body */
  --ink: #2b211d;        /* text */
  --ink-soft: #6b5a50;   /* secondary text */
  --plum: #874460;       /* accent: the jar's painted triangles */
  --sun: #f2ae3a;        /* celebrations and progress */
  --white: #fffaf3;
  --font-play: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --font-ar: "Baloo Bhaijaan 2", "Baloo 2", "Geeza Pro", "Segoe UI", Tahoma, sans-serif;
  color-scheme: light;
}
html, body { background: var(--sand); color: var(--ink); }
body {
  font-family: var(--font-play); font-size: 17px; line-height: 1.45;
  padding-inline: clamp(16px, 4vw, 40px); padding-block: clamp(14px, 3vw, 30px) 36px;
}
:lang(ar), [lang="ar"] { font-family: var(--font-ar); }
.wrap { max-width: 1100px; margin-inline: auto; display: grid; gap: 18px; }

header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 20px; }
header > * { min-width: 0; }
h1 { margin: 0; font-weight: 800; font-size: clamp(30px, 5vw, 50px); line-height: 1; letter-spacing: -.01em; text-wrap: balance; }
h1 .dot { color: var(--plum); }
.tagline { margin: 6px 0 0; color: var(--ink-soft); font-size: clamp(16px, 2vw, 19px); }
.top-actions { display: flex; gap: 8px; }

.stage {
  position: relative; width: 100%; aspect-ratio: 16 / 10; max-height: 70vh; border-radius: 28px; overflow: hidden;
  background:
    radial-gradient(ellipse 60% 55% at 50% 42%, #fff6e8 0%, rgba(255,246,232,0) 72%),
    radial-gradient(ellipse 80% 30% at 50% 100%, #e8cfae 0%, rgba(232,207,174,0) 70%),
    var(--sand-2);
  box-shadow: inset 0 0 0 3px var(--clay);
  touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none;
}
.stage:active { cursor: grabbing; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage .fx { pointer-events: none; }
.bubble {
  position: absolute; top: 18px; left: 50%; transform: translate(-50%, 0) scale(1); transform-origin: 50% 100%;
  max-width: min(88%, 520px); background: var(--white); color: var(--ink); border: 3px solid var(--ink);
  border-radius: 22px; padding: 10px 18px; font-size: clamp(15px, 2vw, 19px); font-weight: 700; text-align: center;
  box-shadow: 0 6px 0 rgba(43,33,29,.18); transition: opacity .25s ease, transform .25s cubic-bezier(.3,1.6,.5,1);
  pointer-events: none; unicode-bidi: plaintext;
}
.bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -14px; width: 20px; height: 20px; background: var(--white);
  border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: translateX(-50%) rotate(45deg);
}
.bubble.hide { opacity: 0; transform: translate(-50%, 8px) scale(.9); }
.status { position: absolute; left: 16px; bottom: 14px; font-size: 13px; color: var(--ink-soft); }

.mission {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  background: var(--white); border: 3px solid var(--ink); border-radius: 20px; padding: 12px 18px;
  box-shadow: 0 5px 0 rgba(43,33,29,.15);
}
.mission > * { min-width: 0; }
.mission-text { flex: 1 1 260px; font-weight: 700; font-size: clamp(16px, 2vw, 20px); unicode-bidi: plaintext; }
.meter { flex: 0 1 220px; height: 16px; border-radius: 999px; background: var(--sand-2); border: 2px solid var(--ink); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--sun); transition: width .4s cubic-bezier(.3,1.4,.5,1); }

.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.btn {
  font: 800 clamp(16px, 2vw, 19px)/1 var(--font-play); color: var(--ink); background: var(--white);
  border: 3px solid var(--ink); border-radius: 999px; padding: 14px 22px; cursor: pointer;
  box-shadow: 0 5px 0 var(--ink); transition: transform .08s ease, box-shadow .08s ease, background .2s;
  display: inline-flex; align-items: center; gap: 10px;
}
.btn:lang(ar), .btn[lang="ar"] { font-family: var(--font-ar); }
.btn:hover { background: #fff1dc; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn:focus-visible { outline: 3px solid var(--plum); outline-offset: 3px; }
.btn.primary { background: var(--plum); color: var(--white); }
.btn.primary:hover { background: #9a5272; }
.btn[aria-pressed="true"] { background: var(--sun); }
.btn.small { font-size: 15px; padding: 9px 14px; box-shadow: 0 3px 0 var(--ink); }
.btn svg { width: 22px; height: 22px; flex: none; }

.about { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: start; color: var(--ink-soft); font-size: 15px; border-top: 2px dashed var(--clay); padding-top: 14px; }
.about b { color: var(--ink); }
.about p { margin: 0; max-width: 70ch; unicode-bidi: plaintext; }
.about .tag { font-weight: 800; color: var(--plum); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; padding-top: 2px; }

[dir="rtl"] .mission, [dir="rtl"] .actions, [dir="rtl"] header { direction: rtl; }

@media (max-width: 640px) {
  .stage { aspect-ratio: 4 / 5; max-height: none; border-radius: 22px; }
  .btn { padding: 12px 16px; }
  .about { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .bubble, .meter i { transition: none; }
}
</style>

<div class="wrap" id="app">
  <header>
    <div>
      <h1 id="t-title">The Painted Jar<span class="dot">.</span></h1>
      <p class="tagline" id="t-tagline">Spin me, tap me, and help me with my missions!</p>
    </div>
    <div class="top-actions">
      <button class="btn small" id="langBtn" type="button" lang="ar">عربي</button>
      <button class="btn small" id="soundBtn" type="button" aria-pressed="true">Sound on</button>
    </div>
  </header>

  <div class="stage" id="stage" aria-label="A 3D painted clay jar. Drag to spin it, tap it to hear about it.">
    <canvas class="fx" id="fx"></canvas>
    <div class="bubble hide" id="bubble" aria-live="polite"></div>
    <div class="status" id="status"></div>
  </div>

  <div class="mission" role="status">
    <div class="mission-text" id="missionText">Drag to spin. Tap the jar.</div>
    <div class="meter" id="meter" hidden><i id="meterFill"></i></div>
  </div>

  <div class="actions">
    <button class="btn primary" id="fixBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l6-6M14 4l6 6-8 8-6-6z"/><path d="M12 8l4 4"/></svg>
      <span id="t-fix">Fix the jar</span>
    </button>
    <button class="btn" id="countBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14L12 19z"/><path d="M8 9h8M10 13h4"/></svg>
      <span id="t-count">Count the triangles</span>
    </button>
    <button class="btn" id="wakeBtn" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="10" r="2.5"/><circle cx="16" cy="10" r="2.5"/><path d="M8 16c2.5 2 5.5 2 8 0"/></svg>
      <span id="t-wake">Wake it up</span>
    </button>
  </div>

  <section class="about">
    <span class="tag" id="t-abouttag">About</span>
    <p id="t-about">A hand-made 3D model inspired by a painted clay jar recorded by the Sharjah Archaeology Authority with Global Digital Heritage. It is not a scan, so some details are different from the real jar.</p>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), fx = $("fx"), statusEl = $("status");
  if (typeof THREE === "undefined") { statusEl.textContent = "The 3D engine did not load."; return; }

  // ---------------- words ----------------
  const T = {
    en: {
      title: 'The Painted Jar<span class="dot">.</span>', tagline: "Spin me, tap me, and help me with my missions!",
      fix: "Fix the jar", count: "Count the triangles", wake: "Wake it up", rest: "Let it rest",
      soundOn: "Sound on", soundOff: "Sound off", lang: "عربي", abouttag: "About",
      about: "A hand-made 3D model inspired by a painted clay jar recorded by the Sharjah Archaeology Authority with Global Digital Heritage. It is not a scan, so some details are different from the real jar.",
      free: "Drag to spin. Tap the jar.",
      facts: [
        "Archaeologists found me in pieces and glued me back together. Can you spot my cracks?",
        "Someone painted my purple triangles by hand, a very long time ago.",
        "The rings on my neck were probably made while the clay spun on a potter's wheel.",
        "I am made of clay that was baked hard in a very hot oven called a kiln.",
        "Be gentle with me! Real jars like me live safely in museums."
      ],
      hello: "Hello! I'm the Painted Jar.", sleepy: "Time for a little nap.",
      breakMsg: "Oh no, the jar broke! Tap each piece to put it back.",
      pieces: (n, N) => n + " of " + N + " pieces back",
      fixed: "You fixed it, just like a real archaeologist!",
      countStart: "How many striped triangles can you find? Tap each one.",
      found: (n) => n === 1 ? "1 triangle found" : n + " triangles found",
      already: "You already found that one!", miss: "Look for the striped triangles that point down.",
      allFound: (n) => "You found all " + n + " triangles!",
      spinMore: "Spin the jar to find the ones on the back.",
      busy: "Finish fixing the jar first!"
    },
    ar: {
      title: 'الجرّة المرسومة<span class="dot">.</span>', tagline: "أدِرني، المسني، وساعدني في مهماتي!",
      fix: "أصلِح الجرّة", count: "عُدّ المثلثات", wake: "أيقِظ الجرّة", rest: "دعها ترتاح",
      soundOn: "الصوت يعمل", soundOff: "الصوت مطفأ", lang: "English", abouttag: "عن القطعة",
      about: "نموذج ثلاثي الأبعاد صُنع يدويًا، مستوحى من جرّة فخارية مرسومة وثّقتها هيئة الشارقة للآثار مع مؤسسة Global Digital Heritage. ليس مسحًا ضوئيًا، لذلك تختلف بعض التفاصيل عن الجرّة الحقيقية.",
      free: "اسحب لتدوير الجرّة. المسها لتسمع عنها.",
      facts: [
        "وجدني علماء الآثار قطعًا صغيرة، ثم ألصقوني من جديد. هل ترى الشقوق؟",
        "رسم أحدهم مثلثاتي البنفسجية بيده، منذ زمن طويل جدًا.",
        "صُنعت الحلقات على رقبتي غالبًا بينما كان الطين يدور على عجلة الفخّار.",
        "أنا مصنوعة من طين خُبز في فرن حار جدًا اسمه الكَمين حتى صار صلبًا.",
        "كن لطيفًا معي! الجرار الحقيقية مثلي تعيش بأمان في المتاحف."
      ],
      hello: "مرحبًا! أنا الجرّة المرسومة.", sleepy: "حان وقت قيلولة صغيرة.",
      breakMsg: "يا للهول، انكسرت الجرّة! المس كل قطعة لتعيدها إلى مكانها.",
      pieces: (n, N) => "أعدت " + n + " من " + N + " قطعة",
      fixed: "أصلحتها مثل عالم آثار حقيقي!",
      countStart: "كم مثلثًا مخططًا تستطيع أن تجد؟ المس كل واحد.",
      found: (n) => "وجدت " + n + (n === 1 ? " مثلثًا" : " مثلثات"),
      already: "لقد وجدت هذا المثلث من قبل!", miss: "ابحث عن المثلثات المخططة التي تشير إلى الأسفل.",
      allFound: (n) => "وجدت المثلثات الـ" + n + " كلها!",
      spinMore: "أدِر الجرّة لتجد المثلثات في الخلف.",
      busy: "أكمل إصلاح الجرّة أولًا!"
    }
  };
  let lang = "en";
  try { if (localStorage.getItem("jar-lang") === "ar") lang = "ar"; } catch (e) {}
  const t = () => T[lang];

  // ---------------- sound ----------------
  let soundOn = true, actx = null;
  function tone(freq, dur, type, vol, slide) {
    if (!soundOn) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      const o = actx.createOscillator(), g = actx.createGain(), now = actx.currentTime;
      o.type = type || "sine"; o.frequency.setValueAtTime(freq, now);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, now + dur);
      g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(vol || 0.15, now + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      o.connect(g); g.connect(actx.destination); o.start(now); o.stop(now + dur + 0.02);
    } catch (e) {}
  }
  const sfx = {
    boing: () => tone(220, 0.28, "sine", 0.18, 520),
    pop: () => tone(660, 0.12, "triangle", 0.14, 990),
    click: () => { tone(880, 0.08, "square", 0.05); tone(1320, 0.14, "sine", 0.1); },
    crash: () => { for (let i = 0; i < 5; i++) setTimeout(() => tone(300 + Math.random() * 500, 0.12, "triangle", 0.09, 120), i * 45); },
    win: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.22, "triangle", 0.14), i * 110)),
    nope: () => tone(260, 0.18, "sine", 0.1, 200)
  };

  // ---------------- renderer ----------------
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); }
  catch (e) { statusEl.textContent = "WebGL is not available in this browser."; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setClearColor(0x000000, 0);
  stage.insertBefore(renderer.domElement, fx);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1.6, 0.1, 50);
  scene.add(new THREE.HemisphereLight(0xfff4e6, 0xd9a07e, 0.85));
  const key = new THREE.DirectionalLight(0xfff0dc, 0.95); key.position.set(-3, 5, 4); scene.add(key);
  const rim = new THREE.DirectionalLight(0xbfd8ff, 0.55); rim.position.set(3, 2.5, -4); scene.add(rim);
  const fill = new THREE.DirectionalLight(0xffe2c8, 0.25); fill.position.set(4, 1, 3); scene.add(fill);

  // contact shadow
  const shCanvas = document.createElement("canvas"); shCanvas.width = shCanvas.height = 128;
  const sg = shCanvas.getContext("2d"), grd = sg.createRadialGradient(64, 64, 4, 64, 64, 64);
  grd.addColorStop(0, "rgba(90,50,30,0.45)"); grd.addColorStop(1, "rgba(90,50,30,0)");
  sg.fillStyle = grd; sg.fillRect(0, 0, 128, 128);
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.2), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shCanvas), transparent: true, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.002; scene.add(shadow);

  // ---------------- jar shape (measured from the reference photo) ----------------
  const HT = 1.95;            // jar height in model units
  const OUTER = [[0,0],[0.17,0],[0.195,0.012],[0.205,0.05],[0.27,0.107],[0.337,0.164],[0.405,0.221],[0.458,0.279],[0.507,0.336],
    [0.552,0.393],[0.592,0.45],[0.627,0.507],[0.656,0.564],[0.682,0.621],[0.705,0.679],[0.72,0.736],[0.727,0.793],[0.732,0.85],
    [0.729,0.907],[0.719,0.964],[0.704,1.021],[0.68,1.079],[0.649,1.136],[0.613,1.193],[0.569,1.25],[0.514,1.307],[0.455,1.364],
    [0.413,1.421],[0.377,1.479],[0.352,1.536],[0.335,1.593],[0.333,1.65],[0.345,1.70],[0.40,1.735],[0.452,1.77],[0.462,1.82],
    [0.463,1.88],[0.455,1.925],[0.44,1.945],[0.425,1.94]];
  const INNER = [[0.425,1.94],[0.418,1.86],[0.41,1.78],[0.33,1.72],[0.30,1.64],[0.295,1.52],[0.22,1.44],[0,1.40]];
  function resample(pts, n, ridges) {
    const curve = new THREE.SplineCurve(pts.map((p) => new THREE.Vector2(p[0], p[1])));
    const out = curve.getSpacedPoints(n).map((v) => [Math.max(0, v.x), v.y]);
    if (ridges) out.forEach((p) => {
      const h = p[1];
      if (h > 1.30 && h < 1.70) {
        const env = Math.sin(Math.PI * (h - 1.30) / 0.40);
        p[0] += 0.011 * env * Math.pow(0.5 + 0.5 * Math.cos(2 * Math.PI * (h - 1.30) / 0.066), 2);
      }
    });
    return out;
  }
  const outerP = resample(OUTER, 260, true), innerP = resample(INNER, 50, false);
  const radiusAt = (h) => { let best = outerP[0]; for (const p of outerP) if (p[1] < 1.6 && Math.abs(p[1] - h) < Math.abs(best[1] - h)) best = p; return best[0]; };

  // ---------------- shard layout: a seeded, warped Voronoi on the jar surface ----------------
  const CIRC = 3.6, N_SHARDS = 14;
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
  const rand = rng(1206);
  const seeds = [];
  [[0.22, 3], [0.68, 4], [1.15, 4], [1.68, 3]].forEach(([h, n], row) => {
    for (let i = 0; i < n; i++) seeds.push([((i + 0.5 + (rand() - 0.5) * 0.5) / n + row * 0.13) % 1 * CIRC, h + (rand() - 0.5) * 0.22]);
  });
  function cellOf(x, y) {
    const wx = x + 0.06 * Math.sin(y * 11 + Math.sin(x * 7) * 1.5), wy = y + 0.05 * Math.sin(x * 9 + Math.sin(y * 6) * 1.7);
    let d1 = 1e9, d2 = 1e9, c = 0;
    for (let i = 0; i < seeds.length; i++) {
      let dx = Math.abs(wx - seeds[i][0]); dx = Math.min(dx, CIRC - dx);
      const dy = wy - seeds[i][1], d = dx * dx + dy * dy;
      if (d < d1) { d2 = d1; d1 = d; c = i; } else if (d < d2) d2 = d;
    }
    return [c, Math.sqrt(d2) - Math.sqrt(d1)];
  }

  // ---------------- painted texture ----------------
  const TW = 2048, TH = 1024, N_TRI = 10;
  const BAND_TOP = 1.12, BAND_BOT = 0.72;
  const tex = document.createElement("canvas"); tex.width = TW; tex.height = TH;
  const g = tex.getContext("2d");
  const vy = (h) => (1 - h / HT) * TH;   // canvas y for a jar height
  const triHalf = 0.5 / N_TRI * 0.9;
  const PAINT = "#7d4157";
  function paintBase() {
    const lg = g.createLinearGradient(0, 0, 0, TH);
    lg.addColorStop(0, "#f0d9c0"); lg.addColorStop(vy(1.5) / TH, "#e8c9ab"); lg.addColorStop(vy(1.14) / TH, "#ecd2b8");
    lg.addColorStop(vy(1.0) / TH, "#f4e4d2"); lg.addColorStop(vy(0.72) / TH, "#f1dfcb"); lg.addColorStop(vy(0.6) / TH, "#e6c4a8");
    lg.addColorStop(1, "#d9b294");
    g.fillStyle = lg; g.fillRect(0, 0, TW, TH);
    const r = rng(7);
    for (let i = 0; i < 26000; i++) {   // clay speckle
      const a = r() * 0.08; g.fillStyle = r() < 0.5 ? "rgba(120,80,60," + a + ")" : "rgba(255,245,235," + a + ")";
      g.fillRect(r() * TW, r() * TH, 1 + r() * 3, 1 + r() * 3);
    }
    g.lineCap = "round";
    const groove = (h, w) => { g.strokeStyle = "rgba(120,78,58,.45)"; g.lineWidth = w; g.beginPath(); g.moveTo(0, vy(h)); g.lineTo(TW, vy(h)); g.stroke();
      g.strokeStyle = "rgba(255,248,238,.5)"; g.lineWidth = w * 0.6; g.beginPath(); g.moveTo(0, vy(h) + w); g.lineTo(TW, vy(h) + w); g.stroke(); };
    [1.17, 1.15, 1.13].forEach((h) => groove(h, 3));
    [0.70, 0.675, 0.65, 0.625].forEach((h) => groove(h, 3));
    for (let h = 1.32; h < 1.70; h += 0.066) groove(h, 4);
  }
  function triPath(k) {
    const cu = (k + 0.5) / N_TRI, top = vy(BAND_TOP - 0.01), apex = vy(BAND_BOT);
    return { l: (cu - triHalf) * TW, r: (cu + triHalf) * TW, c: cu * TW, top, apex };
  }
  function paintTriangles() {
    const r = rng(42);
    for (let k = 0; k < N_TRI; k++) {
      const p = triPath(k), j = () => (r() - 0.5) * 6;

      if (S.hopT < 0.5) hop = Math.sin(S.hopT / 0.5 * Math.PI) * 0.22;
    }
    const bob = reduce || S.mode === "puzzle" ? 0 : Math.sin(clock * 1.6) * 0.025;
    const pre = S.awake && S.hopT < 0.08 ? 0.08 : 0;
    jar.position.y = Math.max(0, bob + hop);
    jar.scale.set(1 + boing * 0.6 + pre * 0.5, 1 - boing - pre, 1 + boing * 0.6 + pre * 0.5);
    jar.rotation.z = S.mode === "puzzle" || reduce ? 0 : Math.sin(clock * 0.9) * 0.025;
    shadow.scale.setScalar(1 - jar.position.y * 0.8); shadow.material.opacity = 1 - jar.position.y * 1.5;

    // face
    S.faceScale += ((S.awake && S.mode !== "puzzle" ? 1 : 0) - S.faceScale) * (1 - Math.exp(-7 * dt));
    face.visible = S.faceScale > 0.02;
    face.scale.setScalar(Math.max(0.001, S.faceScale * (1 + Math.max(0, Math.sin(Math.min(1, S.faceScale) * Math.PI)) * 0.15)));
    if (face.visible) {
      S.nextBlink -= dt; if (S.nextBlink < 0) { S.blinkT = 0; S.nextBlink = 2 + Math.random() * 3.5; }
      S.blinkT += dt; const bl = S.blinkT < 0.16 ? Math.sin(S.blinkT / 0.16 * Math.PI) : 0;
      eyes.forEach(({ e, pupil }) => { e.scale.y = 1 - bl * 0.9; pupil.position.x = S.ptr.x * 0.035; pupil.position.y = S.ptr.y * 0.03; });
    }

    // shards
    shards.forEach((sh) => {
      if (sh.state !== "flying-out" && sh.state !== "flying-home") return;
      sh.t = Math.min(1, sh.t + dt / sh.dur);
      const k = sh.state === "flying-home" ? easeBack(sh.t) : easeOut(sh.t);
      sh.piece.position.lerpVectors(sh.from, sh.to, k);
      sh.piece.position.y += Math.sin(Math.min(1, sh.t) * Math.PI) * sh.arc;
      sh.piece.rotation.set(sh.rotFrom.x + (sh.rotTo.x - sh.rotFrom.x) * k, sh.rotFrom.y + (sh.rotTo.y - sh.rotFrom.y) * k, sh.rotFrom.z + (sh.rotTo.z - sh.rotFrom.z) * k);
      if (sh.t >= 1) {
        if (sh.state === "flying-out") sh.state = "out";
        else { sh.state = "home"; sh.piece.position.copy(sh.home); sh.piece.rotation.set(0, 0, 0); shardArrived(sh); }
      }
    });
    if (S.mode === "puzzle") shards.forEach((sh, i) => { if (sh.state === "out") sh.piece.position.y = sh.to.y + Math.sin(clock * 2.2 + i) * 0.03; });
    shards.forEach((sh) => {   // little shadows under loose pieces
      const loose = sh.state !== "home";
      sh.blob.visible = loose;
      if (loose) { sh.blob.position.x = sh.piece.position.x; sh.blob.position.z = sh.piece.position.z;
        sh.blob.material.opacity = Math.max(0, 0.9 - sh.piece.position.y * 0.5); sh.blob.scale.setScalar(0.7 + sh.piece.position.y * 0.25); }
    });
    shadow.material.opacity = S.mode === "puzzle" && S.placed < shards.length ? 0.15 + 0.85 * S.placed / shards.length : shadow.material.opacity;

    // camera
    const narrow = camera.aspect < 1 ? 1 / camera.aspect : 1;
    const target = S.mode === "puzzle" && S.placed < shards.length ? camPuzzle : camFree;
    camPos.lerp(target.pos, 1 - Math.exp(-2.2 * dt)); camLook.lerp(target.look, 1 - Math.exp(-2.2 * dt));
    camera.position.set(camPos.x + S.ptr.x * 0.12, camPos.y + S.ptr.y * 0.08, camPos.z * (0.6 + 0.4 * narrow));
    camera.lookAt(camLook);

    renderer.render(scene, camera);
    drawFx(dt);
    requestAnimationFrame(frame);
  }
  applyLang();
  requestAnimationFrame(frame);
})();
</script>
