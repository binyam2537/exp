<svg class="fig cdan" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 640" role="img" aria-label="CDAN plus LSTM plus Clear-Sky Index architecture">
<style>
  @font-face { font-family: "STIX Two Text"; font-style: italic; font-weight: 400; src: url(assets/fonts/stix-text-latin-400i.woff2) format("woff2"); unicode-range: U+0000-00FF,U+2000-206F,U+2212; }
  @font-face { font-family: "STIX Two Text"; font-style: italic; font-weight: 400; src: url(assets/fonts/stix-text-latinext-400i.woff2) format("woff2"); unicode-range: U+0100-02BA; }
  @font-face { font-family: "STIX Two Text"; font-style: italic; font-weight: 400; src: url(assets/fonts/stix-text-greek-400i.woff2) format("woff2"); unicode-range: U+0370-03FF; }
  @font-face { font-family: "STIX Two Math"; font-weight: 400; src: url(assets/fonts/stix-math-400.woff2) format("woff2"); }
  .cdan { display: block; width: 100%; height: auto; font-family: var(--sans); }
  .cdan .box { fill: #F8FAFB; stroke: var(--ink-2); stroke-width: 1.8; }
  .cdan .box.key { stroke: var(--teal); stroke-width: 3; }
  .cdan .box.core { fill: #E3E9EE; stroke: var(--navy); stroke-width: 3; }
  .cdan .box.grl { stroke: var(--brick); stroke-width: 3; }
  .cdan .box.tgt { stroke-dasharray: 9 6; }
  .cdan .h { font-size: 27px; font-weight: 700; fill: var(--ink); }
  .cdan .t { font-size: 22px; fill: var(--ink-2); }
  .cdan .note { font-size: 19px; fill: var(--muted); }
  .cdan .mi { font-family: "STIX Two Text", serif; font-style: italic; fill: var(--ink); }
  .cdan .mr { font-family: "STIX Two Math", serif; fill: var(--ink); }
  .cdan .mo { font-family: "STIX Two Math", serif; fill: var(--ink); }
  .cdan .flow { fill: none; stroke: var(--ink-2); stroke-width: 2; }
  .cdan .flow.dash { stroke-dasharray: 8 6; }
  .cdan .ahead { fill: var(--ink-2); }
</style>
<defs><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" class="ahead"/></marker></defs>
<rect x="10" y="40" width="250" height="150" rx="4" class="box src"/>
<text x="135" y="100" class="h" text-anchor="middle">Source data</text>
<text x="135" y="150" font-size="24" text-anchor="middle"><tspan class="mi">D</tspan><tspan class="mi" font-size="16.3" baseline-shift="-28%">S</tspan><tspan class="mo"> (</tspan><tspan class="mi">X</tspan><tspan class="mi" font-size="16.3" baseline-shift="-28%">S</tspan><tspan class="mo">, </tspan><tspan class="mi">Y</tspan><tspan class="mi" font-size="16.3" baseline-shift="-28%">S</tspan><tspan class="mo">)</tspan></text>
<rect x="10" y="440" width="250" height="150" rx="4" class="box tgt"/>
<text x="135" y="500" class="h" text-anchor="middle">Target data</text>
<text x="135" y="550" font-size="24" text-anchor="middle"><tspan class="mi">D</tspan><tspan class="mi" font-size="16.3" baseline-shift="-28%">T</tspan><tspan class="mo"> (</tspan><tspan class="mi">X</tspan><tspan class="mi" font-size="16.3" baseline-shift="-28%">T</tspan><tspan class="mo">)</tspan></text>
<text x="135" y="620" class="note" text-anchor="middle">no target labels</text>
<rect x="320" y="40" width="400" height="150" rx="4" class="box key"/>
<text x="520" y="90" class="h" text-anchor="middle">Capacity decoupling</text>
<text x="520" y="132" font-size="24" text-anchor="middle"><tspan class="mi">y</tspan><tspan class="mr" font-size="16.3" baseline-shift="-28%">norm</tspan><tspan class="mo"> = </tspan><tspan class="mi">Y</tspan><tspan class="mi" font-size="16.3" baseline-shift="-28%">S</tspan><tspan class="mo"> / </tspan><tspan class="mi">C</tspan><tspan class="mi" font-size="16.3" baseline-shift="-28%">S</tspan></text>
<text x="520" y="172" class="t" text-anchor="middle">and CSI stationarization k*</text>
<rect x="320" y="440" width="400" height="150" rx="4" class="box key"/>
<text x="520" y="490" class="h" text-anchor="middle">Target feature engineering</text>
<text x="520" y="532" class="t" text-anchor="middle">and CSI stationarization k*</text>
<text x="520" y="570" class="note" text-anchor="middle">same transform as source</text>
<rect x="790" y="40" width="300" height="550" rx="4" class="box core"/>
<text x="940" y="270" class="h" text-anchor="middle">Feature extractor</text>
<text x="940" y="318" font-size="30" text-anchor="middle"><tspan class="mi">G</tspan><tspan class="mi" font-size="20.4" baseline-shift="-28%">f</tspan></text>
<text x="940" y="362" class="t" text-anchor="middle">2-layer LSTM</text>
<text x="940" y="396" class="t" text-anchor="middle">shared weights</text>
<rect x="1170" y="40" width="330" height="150" rx="4" class="box"/>
<text x="1335" y="92" class="h" text-anchor="middle">Task predictor</text>
<text x="1335" y="136" font-size="28" text-anchor="middle"><tspan class="mi">G</tspan><tspan class="mi" font-size="19.0" baseline-shift="-28%">y</tspan></text>
<text x="1335" y="172" class="t" text-anchor="middle">regression head</text>
<rect x="1590" y="20" width="400" height="110" rx="4" class="box"/>
<text x="1790" y="66" class="h" text-anchor="middle">Huber loss</text>
<text x="1790" y="106" font-size="22" text-anchor="middle"><tspan class="mi">L</tspan><tspan class="mr" font-size="15.0" baseline-shift="-28%">task</tspan><tspan class="mr">  on source labels</tspan></text>
<rect x="1590" y="160" width="400" height="130" rx="4" class="box"/>
<text x="1790" y="204" class="h" text-anchor="middle">Target rescaling</text>
<text x="1790" y="242" font-size="22" text-anchor="middle"><tspan class="mo">× </tspan><tspan class="mi">C</tspan><tspan class="mi" font-size="15.0" baseline-shift="-28%">T</tspan><tspan class="mr">  and nocturnal</tspan></text>
<text x="1790" y="274" class="t" text-anchor="middle">zero-mask</text>
<rect x="1170" y="440" width="230" height="150" rx="4" class="box grl"/>
<text x="1285" y="494" class="h" text-anchor="middle">Gradient</text>
<text x="1285" y="526" class="h" text-anchor="middle">reversal</text>
<text x="1285" y="568" font-size="24" text-anchor="middle"><tspan class="mo">(−</tspan><tspan class="mi">λ</tspan><tspan class="mo">)</tspan></text>
<rect x="1470" y="440" width="300" height="150" rx="4" class="box"/>
<text x="1620" y="488" class="h" text-anchor="middle">Discriminator</text>
<text x="1620" y="528" font-size="26" text-anchor="middle"><tspan class="mi">G</tspan><tspan class="mi" font-size="17.7" baseline-shift="-28%">d</tspan></text>
<text x="1620" y="570" font-size="22" text-anchor="middle"><tspan class="mi">f</tspan><tspan class="mo"> = </tspan><tspan class="mi">h</tspan><tspan class="mo"> ⊗ </tspan><tspan class="mi">ŷ</tspan><tspan class="mr" font-size="15.0" baseline-shift="-28%">norm</tspan></text>
<rect x="1830" y="440" width="160" height="150" rx="4" class="box"/>
<text x="1910" y="490" class="h" text-anchor="middle">BCE loss</text>
<text x="1910" y="530" font-size="22" text-anchor="middle"><tspan class="mi">L</tspan><tspan class="mr" font-size="15.0" baseline-shift="-28%">domain</tspan></text>
<text x="1910" y="568" font-size="20" text-anchor="middle"><tspan class="mi">d</tspan><tspan class="mo"> ∈ {0, 1}</tspan></text>
<path d="M260 115 H314" class="flow" marker-end="url(#ahc)"/>
<path d="M260 515 H314" class="flow" marker-end="url(#ahc)"/>
<path d="M720 115 H784" class="flow" marker-end="url(#ahc)"/>
<path d="M720 515 H784" class="flow" marker-end="url(#ahc)"/>
<path d="M1090 115 H1164" class="flow" marker-end="url(#ahc)"/>
<text x="1127" y="100" font-size="22" text-anchor="middle"><tspan class="mi">h</tspan></text>
<path d="M1090 515 H1164" class="flow" marker-end="url(#ahc)"/>
<text x="1127" y="500" font-size="22" text-anchor="middle"><tspan class="mi">h</tspan></text>
<path d="M1500 90 H1584" class="flow" marker-end="url(#ahc)"/>
<path d="M1500 150 H1545 V225 H1584" class="flow" marker-end="url(#ahc)"/>
<text x="1512" y="335" font-size="22" text-anchor="end"><tspan class="mi">ŷ</tspan><tspan class="mr" font-size="15.0" baseline-shift="-28%">norm</tspan></text>
<path d="M1500 170 H1525 V434" class="flow dash" marker-end="url(#ahc)"/>
<path d="M1400 515 H1464" class="flow" marker-end="url(#ahc)"/>
<path d="M1770 515 H1824" class="flow" marker-end="url(#ahc)"/>
</svg>
