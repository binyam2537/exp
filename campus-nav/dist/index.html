<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Campus Navigator</title>
  <style>
:root {
  --bg: #EEF0F4;
  --card: rgba(255, 255, 255, 0.8);
  --card-solid: #ffffff;
  --text: #1C1C1E;
  --sub: #8E8E93;
  --sep: rgba(60, 60, 67, 0.12);
  --fill: rgba(118, 118, 128, 0.12);
  --blue: #007AFF;
  --red: #FF3B30;
  --green: #34C759;
  --r: 1.35rem;
  --gap: max(0.9rem, env(safe-area-inset-left));
  --shadow: 0 0.6rem 2rem rgba(20, 24, 40, 0.10), 0 0.08rem 0.25rem rgba(20, 24, 40, 0.06);
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  /* Scales the whole UI with the screen: phone ≈ 14px, 1080p totem ≈ 17px, 4K ≈ 22px */
  font-size: clamp(14px, 0.9vmin + 7px, 22px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior: none;
}

button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
.ic { width: 1.25rem; height: 1.25rem; flex: none; display: block; }
[hidden] { display: none !important; }

#map { position: fixed; inset: 0; touch-action: none; }
#map canvas { display: block; outline: none; }
.labels { position: absolute; inset: 0; pointer-events: none; }

/* ---------------------------------------------------------------- map labels */
.lbl-wrap { transition: opacity 0.3s; }
.lbl-wrap.far { opacity: 0; }
.lbl {
  display: flex; align-items: center; gap: 0.32rem;
  padding: 0.2rem 0.6rem 0.2rem 0.2rem;
  background: rgba(255, 255, 255, 0.94);
  border-radius: 99px;
  box-shadow: 0 0.15rem 0.6rem rgba(20, 24, 40, 0.12);
  font-size: 0.72rem; font-weight: 600; letter-spacing: -0.01em;
  white-space: nowrap;
  transition: transform 0.35s var(--ease), background 0.25s, color 0.25s;
}
.lbl.icon-only { padding: 0.2rem; }
.lbl-dot {
  width: 1.35rem; height: 1.35rem; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--c); color: #fff;
}
.lbl-dot .ic { width: 0.85rem; height: 0.85rem; stroke-width: 2.2; }
.lbl-wrap.sel .lbl { transform: scale(1.18) translateY(-0.2rem); background: var(--c); color: #fff; }
.lbl-wrap.sel .lbl-dot { background: rgba(255, 255, 255, 0.25); }

.you-tag {
  padding: 0.22rem 0.6rem; border-radius: 99px;
  background: var(--blue); color: #fff;
  font-size: 0.7rem; font-weight: 600; white-space: nowrap;
  box-shadow: 0 0.2rem 0.6rem rgba(0, 122, 255, 0.35);
}
[data-view="nav"] .you-tag, [data-view="arrived"] .you-tag { display: none; }

/* ---------------------------------------------------------------- shell */
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }

.top {
  position: absolute;
  top: max(var(--gap), env(safe-area-inset-top));
  left: var(--gap);
  right: calc(var(--gap) + 3.4rem + 0.75rem);
  display: flex; flex-direction: column; gap: 0.6rem;
  pointer-events: none;
}
.top > * { pointer-events: auto; }
[data-view="search"] .top { right: var(--gap); }
[data-view="nav"] .top, [data-view="arrived"] .top { right: var(--gap); max-width: 34rem; }

.card {
  background: var(--card);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  border: 0.5px solid rgba(255, 255, 255, 0.6);
  animation: in 0.42s var(--ease) both;
}
@keyframes in { from { opacity: 0; transform: translateY(-0.6rem) scale(0.98); } }

/* ---------------------------------------------------------------- home */
.home { padding: 0.45rem; }
.search-pill {
  width: 100%;
  display: flex; align-items: center; gap: 0.6rem;
  padding: 0.85rem 1rem;
  border-radius: calc(var(--r) - 0.4rem);
  background: var(--fill);
  font-size: 1.06rem; color: var(--sub); text-align: left;
}
.search-pill .ic { width: 1.2rem; height: 1.2rem; color: var(--sub); }
.chips {
  display: flex; gap: 0.45rem;
  overflow-x: auto; scrollbar-width: none;
  padding: 0.5rem 0.1rem 0.1rem;
  touch-action: pan-x;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  display: flex; align-items: center; gap: 0.4rem;
  padding: 0.38rem 0.8rem 0.38rem 0.38rem;
  border-radius: 99px;
  background: var(--card-solid);
  box-shadow: 0 0 0 0.5px var(--sep);
  font-size: 0.86rem; font-weight: 600;
  transition: background 0.2s, color 0.2s, transform 0.15s;
}
.chip:active, .row:active, .fab:active, .round:active, .primary:active, .search-pill:active { transform: scale(0.96); }
.chip-ic { width: 1.55rem; height: 1.55rem; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #fff; }
.chip-ic .ic { width: 0.95rem; height: 0.95rem; }
.chip.on { background: var(--c); color: #fff; }
.chip.on .chip-ic { background: rgba(255, 255, 255, 0.25); }

/* ---------------------------------------------------------------- search panel */
.panel { padding: 0.45rem; display: flex; flex-direction: column; max-height: calc(100dvh - 2 * var(--gap)); }
.search-row { display: flex; align-items: center; gap: 0.55rem; padding: 0 0.3rem 0 0.9rem; background: var(--fill); border-radius: calc(var(--r) - 0.4rem); }
.search-row .ic { color: var(--sub); }
.search-row input {
  flex: 1; min-width: 0;
  border: 0; outline: 0; background: none;
  font: inherit; font-size: 1.06rem; color: var(--text);
  padding: 0.85rem 0;
  user-select: text; -webkit-user-select: text;
}
.search-row input::-webkit-search-cancel-button { display: none; }
.txt-btn { color: var(--blue); font-weight: 500; font-size: 1rem; padding: 0.6rem 0.7rem; }
.results { overflow-y: auto; margin-top: 0.3rem; padding: 0 0.1rem; overscroll-behavior: contain; touch-action: pan-y; }
.row {
  width: 100%;
  display: flex; align-items: center; gap: 0.85rem;
  padding: 0.6rem 0.6rem;
  border-radius: 0.9rem;
  text-align: left;
  transition: background 0.15s, transform 0.15s;
}
.row + .row { box-shadow: inset 0 0.5px 0 var(--sep); }
.row:hover { background: var(--fill); }
.ic-circle { width: 2.4rem; height: 2.4rem; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--c); color: #fff; }
.ic-circle .ic { width: 1.2rem; height: 1.2rem; }
.ic-circle.here { background: rgba(0, 122, 255, 0.14); }
.ic-circle.here i { width: 0.9rem; height: 0.9rem; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 0.2rem #fff; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row-main b { font-weight: 600; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-main small, .row-meta { color: var(--sub); font-size: 0.82rem; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; padding: 2rem; color: var(--sub); }
.empty .ic { width: 2rem; height: 2rem; }

/* ---------------------------------------------------------------- route card */
.routecard { padding: 0.5rem; }
.ends {
  display: grid;
  grid-template-columns: 2.2rem 1fr auto;
  grid-template-rows: auto auto;
  column-gap: 0.25rem;
}
.rail { grid-row: 1 / 3; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 1.05rem 0 0.9rem; }
.dot-from { width: 0.85rem; height: 0.85rem; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 0.2rem rgba(0, 122, 255, 0.2); }
.dot-from.room { background: #fff; box-shadow: inset 0 0 0 0.2rem var(--sub); }
.dots { flex: 1; width: 0; margin: 0.3rem 0; border-left: 0.16rem dotted #C7C7CC; }
.pin-ic { color: var(--red); width: 1.2rem; height: 1.2rem; }
.end {
  display: flex; flex-direction: column; justify-content: center;
  padding: 0.5rem 0.7rem; min-height: 3.1rem;
  border-radius: 0.9rem; text-align: left; min-width: 0;
}
.end:hover { background: var(--fill); }
.end b { font-size: 1.02rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.end small { font-size: 0.8rem; color: var(--sub); }
#fromBtn b { font-weight: 500; }
.end-actions { grid-column: 3; grid-row: 1 / 3; display: flex; flex-direction: column; justify-content: space-between; padding: 0.25rem; }
.round {
  width: 2.5rem; height: 2.5rem; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--fill);
  transition: transform 0.15s, background 0.2s;
}
.round .ic { width: 1.1rem; height: 1.1rem; }
.round.ghost { background: transparent; color: var(--sub); }
.round.ghost:hover { background: var(--fill); }
.round.danger { background: var(--red); color: #fff; }

.summary {
  display: flex; align-items: center; gap: 0.8rem;
  margin-top: 0.4rem; padding: 0.7rem 0.4rem 0.2rem 0.8rem;
  border-top: 0.5px solid var(--sep);
}
.eta { display: flex; flex-direction: column; }
.eta b { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; color: var(--green); line-height: 1.1; }
.eta small { color: var(--sub); font-size: 0.85rem; }
.steps-mini { flex: 1; display: flex; align-items: center; gap: 0.25rem; overflow: hidden; color: var(--sub); }
.mini { width: 1.75rem; height: 1.75rem; border-radius: 0.5rem; background: var(--fill); display: grid; place-items: center; flex: none; color: var(--text); }
.mini .ic { width: 1rem; height: 1rem; }
.mini.end { background: rgba(255, 59, 48, 0.12); color: var(--red); }
.sep { width: 0.3rem; height: 0.3rem; border-radius: 50%; background: #C7C7CC; flex: none; }
.primary {
  display: flex; align-items: center; gap: 0.45rem;
  padding: 0.8rem 1.35rem;
  border-radius: 99px;
  background: var(--blue); color: #fff;
  font-weight: 600; font-size: 1.02rem;
  box-shadow: 0 0.4rem 1.2rem rgba(0, 122, 255, 0.35);
  transition: transform 0.15s;
}
.primary .ic { width: 1rem; height: 1rem; }

/* ---------------------------------------------------------------- navigation banner */
.navwrap { display: flex; flex-direction: column; gap: 0.5rem; }
.banner {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 1rem;
  padding: 1rem 1.2rem 1.15rem;
  border-radius: var(--r);
  background: rgba(28, 28, 30, 0.92);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  color: #fff;
  box-shadow: 0 0.8rem 2.4rem rgba(0, 0, 0, 0.25);
  animation: in 0.42s var(--ease) both;
  transition: background 0.4s;
}
.banner.pop .man { animation: pop 0.45s var(--ease); }
@keyframes pop { from { transform: scale(0.6); opacity: 0; } }
.man { width: 3.6rem; height: 3.6rem; border-radius: 1rem; display: grid; place-items: center; background: rgba(255, 255, 255, 0.12); flex: none; }
.man .ic { width: 2.3rem; height: 2.3rem; stroke-width: 2.4; }
.man-txt { display: flex; flex-direction: column; min-width: 0; }
.man-txt b { font-size: 1.9rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.man-txt span { font-size: 1.05rem; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress { position: absolute; left: 0; right: 0; bottom: 0; height: 0.22rem; background: rgba(255, 255, 255, 0.12); }
.progress i { display: block; height: 100%; background: var(--blue); transform-origin: left; transform: scaleX(0); }
.arrived .banner { background: rgba(52, 199, 89, 0.95); }
.arrived .man { background: rgba(255, 255, 255, 0.22); }
.arrived .progress { display: none; }

.navbar { display: flex; align-items: center; gap: 0.6rem; padding: 0.45rem 0.45rem 0.45rem 0.9rem; }
.then { display: flex; align-items: center; gap: 0.35rem; color: var(--sub); font-size: 0.85rem; font-weight: 600; }
.then .ic { width: 1.15rem; height: 1.15rem; color: var(--text); }
.nav-eta { flex: 1; display: flex; align-items: baseline; justify-content: flex-end; gap: 0.45rem; }
.nav-eta b { font-size: 1.15rem; color: var(--green); }
.nav-eta small { color: var(--sub); font-size: 0.85rem; }
.arrived .then { display: none; }
.arrived .nav-eta { justify-content: flex-start; }
.arrived #pauseBtn { background: var(--green); color: #fff; }
.arrived #exitBtn { display: none; }

/* ---------------------------------------------------------------- map controls */
.ctrls {
  position: absolute;
  right: var(--gap);
  top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 0.55rem;
  transition: opacity 0.3s, transform 0.4s var(--ease);
}
.ctrls.hide { opacity: 0; transform: translate(1rem, -50%); pointer-events: none; }
.fab {
  width: 3.4rem; height: 3.4rem;
  display: grid; place-items: center;
  border-radius: 1.05rem;
  background: var(--card);
  backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
  box-shadow: var(--shadow);
  transition: transform 0.15s;
}
.fab b { font-size: 0.98rem; font-weight: 700; letter-spacing: 0.02em; }
.fab .ic { width: 1.35rem; height: 1.35rem; }
#btnLocate .ic { color: var(--blue); }
.compass { width: 1.7rem !important; height: 1.7rem !important; transition: transform 0.1s linear; }
.floor { cursor: default; }
.floor small { font-size: 1rem; font-weight: 700; width: 2.1rem; height: 2.1rem; border-radius: 0.65rem; display: grid; place-items: center; background: var(--blue); color: #fff; }
.fab-group { display: flex; flex-direction: column; border-radius: 1.05rem; box-shadow: var(--shadow); overflow: hidden; }
.fab-group .fab { box-shadow: none; border-radius: 0; }
.fab-group .fab + .fab { box-shadow: inset 0 0.5px 0 var(--sep); }

@media (min-aspect-ratio: 1/1) {
  .top { max-width: 30rem; }
}
@media (max-height: 520px) {
  .fab-group { display: none; }
}
</style>
